<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>코딩 AI 에이전트</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020; --panel: #121a2b; --panel2: #182238;
      --line: #293650; --text: #e8edf7; --muted: #9aa8c0;
      --blue: #76a9ff; --green: #72e0b0; --red: #ff8b9b;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: radial-gradient(ellipse at top, #14203b 0, var(--bg) 48%);
      color: var(--text); font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    button, textarea { font: inherit; }
    .app { width: min(900px, 100%); margin: 0 auto; padding: 18px 14px calc(30px + env(safe-area-inset-bottom)); }
    header { display: flex; align-items: center; gap: 12px; margin: 8px 0 18px; }
    .logo { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(135deg,#467cff,#9b8cff); font-weight: 900; color: white; }
    h1 { font-size: 20px; line-height: 1.2; margin: 0; letter-spacing: -.4px; }
    .subtitle { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .status { margin-left: auto; border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .panel { border: 1px solid var(--line); background: rgba(18,26,43,.94); border-radius: var(--radius); padding: 16px; margin: 12px 0; box-shadow: 0 12px 34px #0002; }
    .panel-title { font-size: 13px; font-weight: 750; margin-bottom: 10px; color: #cbd7ec; }
    textarea {
      display: block; width: 100%; min-height: 150px; resize: vertical; border: 1px solid #344361;
      background: #0b1222; color: var(--text); border-radius: 13px; padding: 13px; outline: none;
    }
    textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #76a9ff22; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    button { border: 0; border-radius: 12px; padding: 11px 14px; cursor: pointer; font-weight: 750; }
    button:disabled { opacity: .55; cursor: wait; }
    .primary { flex: 1; color: #071021; background: linear-gradient(120deg,#8ab7ff,#a6a0ff); }
    .secondary { color: var(--text); background: var(--panel2); border: 1px solid var(--line); }
    .hint { color: var(--muted); font-size: 12px; margin-top: 9px; }
    .error { color: var(--red); white-space: pre-wrap; }
    .answer { overflow-wrap: anywhere; }
    .answer h1, .answer h2, .answer h3 { margin: 1.1em 0 .4em; font-size: 16px; }
    .answer p { margin: .65em 0; }
    .answer ul, .answer ol { padding-left: 22px; }
    .answer pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #080d18; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto; }
    .answer code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .metric { background: #0b1222; border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
    .metric small { display: block; color: var(--muted); font-size: 11px; }
    .metric strong { display: block; font-size: 18px; overflow-wrap: anywhere; }
    .refs { display: grid; gap: 8px; }
    .ref { padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: #0d1526; }
    a { color: var(--blue); overflow-wrap: anywhere; }
    .ref-title { font-weight: 700; }
    .hidden { display: none; }
    .loading { display: inline-flex; align-items: center; gap: 8px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: pulse 1s infinite alternate; }
    @keyframes pulse { to { opacity: .25; transform: scale(.7); } }
    .history-item { border-top: 1px solid var(--line); padding: 10px 0; }
    .history-item:first-child { border-top: 0; }
    .history-question { font-size: 13px; font-weight: 650; }
    .history-meta { color: var(--muted); font-size: 11px; }
    footer { text-align: center; color: var(--muted); font-size: 11px; padding: 12px 0; }
    @media (min-width: 650px) { .app { padding: 28px 22px 40px; } .panel { padding: 20px; } textarea { min-height: 180px; } }
    @media (max-width: 380px) { .status { display: none; } .metrics { grid-template-columns: 1fr; } .actions button { padding: 10px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">AI</div>
      <div>
        <h1>코딩 AI 에이전트</h1>
        <div class="subtitle">Gemini 분석 · GitHub 참고 코드 · 다음 단계 예측</div>
      </div>
      <div id="status" class="status">연결 확인 중</div>
    </header>

    <section class="panel">
      <div class="panel-title">질문 또는 코드</div>
      <textarea id="question" maxlength="12000" placeholder="예: 이 JavaScript 코드의 비동기 흐름을 설명하고, 오류 처리와 테스트 개선점을 제안해 줘.&#10;&#10;코드를 붙여 넣어도 됩니다."></textarea>
      <div class="actions">
        <button id="analyzeBtn" class="primary">분석하기</button>
        <button id="clearBtn" class="secondary" type="button">지우기</button>
      </div>
      <div class="hint">입력은 최대 12,000자입니다. 분석 요청은 서버에서 처리되며 API 키는 브라우저에 노출되지 않습니다.</div>
      <div id="error" class="error hidden" role="alert"></div>
    </section>

    <section id="resultPanel" class="panel hidden" aria-live="polite">
      <div class="panel-title">분석 결과</div>
      <div id="answer" class="answer"></div>
      <div class="actions">
        <button id="copyBtn" class="secondary" type="button">답변 복사</button>
      </div>
    </section>

    <section id="metricsPanel" class="panel hidden">
      <div class="panel-title">토큰 및 처리 정보</div>
      <div class="metrics">
        <div class="metric"><small>입력 토큰</small><strong id="inputTokens">—</strong></div>
        <div class="metric"><small>출력 토큰</small><strong id="outputTokens">—</strong></div>
        <div class="metric"><small>처리 시간</small><strong id="duration">—</strong></div>
      </div>
      <div id="tokenNote" class="hint"></div>
      <div id="githubWarning" class="hint error"></div>
    </section>

    <section id="refsPanel" class="panel hidden">
      <div class="panel-title">GitHub 참고 자료</div>
      <div id="refs" class="refs"></div>
    </section>

    <section class="panel">
      <div class="panel-title">최근 분석 기록</div>
      <div id="history"><div class="hint">기록을 불러오는 중…</div></div>
      <div class="actions"><button id="refreshBtn" class="secondary" type="button">기록 새로고침</button></div>
    </section>
    <footer>개인 프로젝트용 코딩 도우미 · 키는 서버 환경변수에만 저장하세요.</footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let latestAnswer = "";

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    // Minimal Markdown renderer for headings, lists, fenced code and paragraphs.
    // All raw HTML is escaped first, so model output is displayed as text.
    function renderMarkdown(markdown) {
      const escaped = escapeHtml(markdown);
      const codeBlocks = [];
      let text = escaped.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_m, lang, code) => {
        const token = `@@CODE${codeBlocks.length}@@`;
        codeBlocks.push(`<pre><code>${code}</code></pre>`);
        return token;
      });
      text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>")
        .replace(/^## (.*)$/gm, "<h2>$1</h2>")
        .replace(/^# (.*)$/gm, "<h1>$1</h1>");
      text = text.replace(/^\s*[-*] (.*)$/gm, "<li>$1</li>");
      text = text.replace(/(?:<li>[\s\S]*?<\/li>\n?)+/g, (list) => `<ul>${list}</ul>`);
      text = text.replace(/^\s*\d+[.)] (.*)$/gm, "<li>$1</li>");
      text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      text = text.split(/\n{2,}/).map((block) => {
        if (/^(<h[1-3]>|<ul>|@@CODE\d+@@)/.test(block.trim())) return block;
        return `<p>${block.replace(/\n/g, "<br>")}</p>`;
      }).join("\n");
      return text.replace(/@@CODE(\d+)@@/g, (_m, index) => codeBlocks[Number(index)] || "");
    }

    async function checkHealth() {
      try {
        const response = await fetch("/api/health");
        const data = await response.json();
        $("status").textContent = data.ok && data.database === "connected" ? "서버 연결됨" : "설정 확인 필요";
      } catch {
        $("status").textContent = "서버 연결 실패";
      }
    }

    async function analyze() {
      const question = $("question").value.trim();
      $("error").classList.add("hidden");
      if (!question) {
        $("error").textContent = "질문 또는 코드를 입력해 주세요.";
        $("error").classList.remove("hidden");
        return;
      }

      const button = $("analyzeBtn");
      button.disabled = true;
      button.innerHTML = '<span class="loading"><span class="dot"></span>분석 중…</span>';
      $("resultPanel").classList.remove("hidden");
      $("answer").textContent = "GitHub 참고 자료를 찾고 Gemini가 분석하고 있습니다.";
      $("metricsPanel").classList.add("hidden");
      $("refsPanel").classList.add("hidden");

      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "요청에 실패했습니다.");

        latestAnswer = data.answer || "";
        $("answer").innerHTML = renderMarkdown(latestAnswer);
        $("metricsPanel").classList.remove("hidden");
        $("inputTokens").textContent = data.tokenUsage?.inputTokens ?? "—";
        $("outputTokens").textContent = data.tokenUsage?.outputTokens ?? "—";
        $("duration").textContent = `${data.durationMs ?? 0} ms`;
        $("tokenNote").textContent = data.tokenUsage?.tokenizer || "";
        $("githubWarning").textContent = data.githubWarning ? `GitHub 참고 검색 알림: ${data.githubWarning}` : "";

        const references = data.references || [];
        $("refsPanel").classList.toggle("hidden", references.length === 0);
        $("refs").innerHTML = references.map((ref) => `
          <div class="ref">
            <div class="ref-title">${escapeHtml(ref.repository)} / ${escapeHtml(ref.path)}</div>
            <a href="${escapeHtml(ref.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(ref.url)}</a>
          </div>
        `).join("");
        await loadHistory();
      } catch (error) {
        $("error").textContent = error.message || "알 수 없는 오류가 발생했습니다.";
        $("error").classList.remove("hidden");
        $("answer").textContent = "분석 결과를 표시할 수 없습니다.";
      } finally {
        button.disabled = false;
        button.textContent = "분석하기";
      }
    }

    async function loadHistory() {
      try {
        const response = await fetch("/api/history?limit=8");
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "기록을 불러오지 못했습니다.");
        $("history").innerHTML = data.length ? data.map((item) => `
          <div class="history-item">
            <div class="history-question">${escapeHtml(item.question.slice(0, 180))}${item.question.length > 180 ? "…" : ""}</div>
            <div class="history-meta">${escapeHtml(new Date(item.createdAt).toLocaleString())} · 입력 ${escapeHtml(item.tokenUsage?.inputTokens ?? "—")} 토큰</div>
          </div>
        `).join("") : '<div class="hint">아직 저장된 분석이 없습니다.</div>';
      } catch (error) {
        $("history").innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      }
    }

    $("analyzeBtn").addEventListener("click", analyze);
    $("clearBtn").addEventListener("click", () => {
      $("question").value = "";
      $("error").classList.add("hidden");
      $("question").focus();
    });
    $("copyBtn").addEventListener("click", async () => {
      if (!latestAnswer) return;
      try {
        await navigator.clipboard.writeText(latestAnswer);
        $("copyBtn").textContent = "복사 완료";
        setTimeout(() => $("copyBtn").textContent = "답변 복사", 1400);
      } catch {
        $("error").textContent = "복사에 실패했습니다. 답변을 길게 눌러 직접 복사해 주세요.";
        $("error").classList.remove("hidden");
      }
    });
    $("refreshBtn").addEventListener("click", loadHistory);
    $("question").addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") analyze();
    });

    checkHealth();
    loadHistory();
  </script>
</body>
</html>
